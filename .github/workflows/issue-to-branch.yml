name: Issue → 브랜치 자동 생성

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 브랜치 이름 설정
        id: vars
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          BRANCH_NAME="feature/${ISSUE_NUMBER}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT

      - name: feature 브랜치 생성 (main 기준)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.vars.outputs.branch_name }}
          git push origin ${{ steps.vars.outputs.branch_name }}

      - name: 이슈 정보 artifact 저장
        run: |
          printf '%s\n%s' \
            "${{ steps.vars.outputs.issue_number }}" \
            "${{ steps.vars.outputs.branch_name }}" \
            > /tmp/issue-info.txt

      - name: Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: issue-info
          path: /tmp/issue-info.txt
          retention-days: 1

      - name: Discord 알림 전송
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🌿 브랜치 자동 생성 완료",
                "color": 3066993,
                "fields": [
                  {
                    "name": "📌 이슈",
                    "value": "[#${{ steps.vars.outputs.issue_number }} ${{ github.event.issue.title }}](${{ github.event.issue.html_url }})",
                    "inline": false
                  },
                  {
                    "name": "🔀 브랜치",
                    "value": "`${{ steps.vars.outputs.branch_name }}` (main 기준으로 생성됨)",
                    "inline": false
                  },
                  {
                    "name": "⏭️ 다음 단계",
                    "value": "AI 코드 생성 후 자동으로 PR이 생성됩니다",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "TodayWhat Extension Pipeline"
                },
                "timestamp": "${{ github.event.issue.created_at }}"
              }]
            }'
