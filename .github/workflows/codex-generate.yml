name: Codex 코드 생성 → PR

on:
  workflow_run:
    workflows: ["Issue → 브랜치 자동 생성"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '재시도할 Issue 번호'
        required: true
        type: string

jobs:
  codex-generate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Artifact 다운로드 (workflow_run 전용)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: issue-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/

      - name: 이슈 정보 추출 & 태스크 파일 생성
        id: info
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let issueNumber, branch;

            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number);
              branch = `feature/${issueNumber}`;
            } else {
              const raw = fs.readFileSync('/tmp/issue-info.txt', 'utf8').trim().split('\n');
              issueNumber = parseInt(raw[0]);
              branch = raw[1];
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('branch', branch);
            core.setOutput('title', issue.title);

            const task = `Issue #${issueNumber}: ${issue.title}\n\n${issue.body || '상세 설명 없음'}`;
            fs.writeFileSync('/tmp/codex-task.txt', task, 'utf8');
            console.log('태스크:', task);

      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.info.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Codex CLI 설치
        run: npm install -g @openai/codex

      - name: Codex 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: codex --approval-mode full-auto "$(cat /tmp/codex-task.txt)"

      - name: 변경사항 커밋 & 푸시
        id: commit
        env:
          ISSUE_NUMBER: ${{ steps.info.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.info.outputs.title }}
          BRANCH: ${{ steps.info.outputs.branch }}
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add -A
            git commit -m "feat(#${ISSUE_NUMBER}): ${ISSUE_TITLE}"
            git push origin "${BRANCH}"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: PR 생성
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.info.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.info.outputs.title }}
          BRANCH: ${{ steps.info.outputs.branch }}
        run: |
          gh pr create \
            --title "[#${ISSUE_NUMBER}] ${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUMBER}

          > 🤖 AI(Codex)가 Issue 설명을 기반으로 자동 생성한 코드입니다." \
            --base main \
            --head "${BRANCH}"

      - name: 코드 생성 없음 Discord 알림
        if: steps.commit.outputs.changed == 'false'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_NUMBER: ${{ steps.info.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.info.outputs.title }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"⚠️ Codex 코드 생성 없음\",\"color\":16776960,\"description\":\"Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\\n\\nCodex가 변경사항을 생성하지 않았습니다. Issue 설명을 더 구체적으로 작성해주세요.\",\"footer\":{\"text\":\"TodayWhat Pipeline\"}}]}"
